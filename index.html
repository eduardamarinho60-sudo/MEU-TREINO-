<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B2A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3B2A45; --plum2:#5B4668; --rose:#C9657A; --rose2:#E7A8B4; --blush:#F8EBEE;
  --bg:#F5F2F6; --card:#FFFFFF; --line:#E9E1EC; --ink:#2E2433; --muted:#857A8D;
  --sage:#4E9A7C; --sage2:#E4F2EC; --warn:#C0803A;
  --nav-h:66px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;
  padding-top:var(--safe-t);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--rose2);outline-offset:2px}
.serif{font-family:'Lora',Georgia,serif}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav-h) + var(--safe-b) + 96px)}

/* top */
.top{padding:22px 2px 14px}
.top h1{font-family:'Lora',Georgia,serif;font-size:32px;line-height:1.1;margin:0;color:var(--plum);font-weight:700}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--plum2);font-weight:500;font-size:14px;padding:14px 0 0;min-height:44px}

/* home */
.weekcard{background:var(--plum);color:#fff;border-radius:28px;padding:22px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.weekcard:after{content:"";position:absolute;right:-60px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(231,168,180,.35),rgba(231,168,180,0) 70%)}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-direction:column;line-height:1}
.ring b small{font-size:11px;font-weight:400;color:var(--rose2);margin-top:4px}
.weekcard h2{margin:0;font-family:'Lora',serif;font-size:21px;line-height:1.2}
.weekcard p{margin:6px 0 0;color:#E9DDEE;font-size:13.5px}
.days{display:grid;gap:10px;margin-top:18px}
.day{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:12px 14px 12px 12px;border:1px solid var(--line);text-align:left;width:100%;min-height:76px}
.day .dn{flex:none;width:52px;height:52px;border-radius:16px;background:var(--blush);color:var(--rose);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1}
.day .dn small{font-size:10.5px;font-weight:500;margin-top:3px;color:var(--muted)}
.day.today{border-color:var(--rose2);box-shadow:0 0 0 3px rgba(231,168,180,.25)}
.day.done .dn{background:var(--sage2);color:var(--sage)}
.day .t{flex:1;min-width:0}
.day .t b{display:block;font-size:16px;color:var(--plum)}
.day .t span{font-size:13px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:#F0ECF2;color:var(--plum2);white-space:nowrap}
.pill.ok{background:var(--sage2);color:var(--sage)}
.pill.go{background:var(--blush);color:var(--rose)}
.sectionh{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 10px}
.sectionh h3{margin:0;font-size:17px;color:var(--plum)}
.sectionh a,.sectionh button{font-size:13.5px;color:var(--rose);font-weight:600;text-decoration:none}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:18px;font-weight:600;font-size:16px}
.btn.primary{background:var(--rose);color:#fff}
.btn.dark{background:var(--plum);color:#fff}
.btn.soft{background:var(--blush);color:var(--rose)}
.btn.ghost{background:#EFEAF1;color:var(--plum2)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;border-radius:14px;font-size:14px}
.btn:disabled{opacity:.45}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--plum2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--sage)}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty b{display:block;color:var(--plum);font-size:16px;margin-bottom:4px}

/* workout */
.wtimer{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:rgba(245,242,246,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.wtimer .clock{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;color:var(--plum);line-height:1}
.wtimer small{display:block;font-size:12px;color:var(--muted)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin-top:14px}
.ex.done{border-color:#BFE0D2}
.ex .fig{background:linear-gradient(180deg,#fff,var(--blush));padding:6px 20px 0;position:relative}
.ex .fig svg{display:block;width:100%;max-width:330px;height:auto;margin:0 auto}
.ex .num{position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--plum);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.ex.done .num{background:var(--sage)}
.ex .body{padding:14px 16px 16px}
.ex h2{margin:0;font-size:21px;color:var(--plum);line-height:1.2}
.meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.meta span{background:var(--blush);color:var(--plum);border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:600}
.meta span.r{background:#EFEAF1;color:var(--plum2)}
.tip{display:flex;gap:8px;font-size:13px;color:#5A4E61;margin-top:10px;line-height:1.45}
.tip i{flex:none;font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.last{margin-top:12px;background:#F7F4F8;border-radius:16px;padding:10px 12px;font-size:13px;color:var(--plum2)}
.last b{color:var(--plum)}
.last .lr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{color:var(--rose);font-weight:600;font-size:13px;min-height:36px;padding:0 4px}
.sets{margin-top:12px;display:grid;gap:8px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center}
.set .sn{font-weight:700;color:var(--muted);font-size:14px;text-align:center}
.field{position:relative}
.field input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:16px;padding:14px 38px 0 12px;background:#fff;font-weight:600;font-size:18px;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field label{position:absolute;left:12px;top:6px;font-size:11px;color:var(--muted);pointer-events:none}
.field .u{position:absolute;right:12px;top:22px;font-size:12px;color:var(--muted);pointer-events:none}
.field input::placeholder{color:#C9BFCD;font-weight:500}
.set.ok .field input{border-color:#BFE0D2;background:#FAFDFB}
.chk{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.chk svg{width:24px;height:24px;stroke:#D4CAD8}
.set.ok .chk{background:var(--sage);border-color:var(--sage)}
.set.ok .chk svg{stroke:#fff}
.cmp{grid-column:2 / 5;font-size:12.5px;font-weight:600;margin-top:-2px;min-height:0}
.cmp.up{color:var(--sage)} .cmp.eq{color:var(--muted)} .cmp.down{color:var(--warn)}
.exfoot{display:flex;gap:8px;margin-top:14px}
.exfoot .btn{flex:1}
.btn.done-on{background:var(--sage);color:#fff}

/* cardio block */
.cardio{background:var(--plum);color:#fff;border-radius:26px;margin-top:16px;overflow:hidden}
.cardio .fig{background:#fff;margin:12px;border-radius:18px;padding:4px 30px}
.cardio .fig svg{display:block;width:100%;max-width:260px;margin:0 auto}
.cardio .body{padding:4px 18px 18px}
.cardio h2{margin:0;font-family:'Lora',serif;font-size:23px}
.cardio p{color:#E9DDEE;font-size:13.5px;margin:6px 0 0}
.cardio .field input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.cardio .field label,.cardio .field .u{color:var(--rose2)}
.cardio .field input::placeholder{color:rgba(255,255,255,.35)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:12px;min-height:84px;resize:vertical;background:#fff}
.cardio textarea{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.cardio textarea::placeholder{color:rgba(255,255,255,.4)}

/* rest bar */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 10px);width:min(528px,calc(100% - 24px));z-index:40;
  background:var(--ink);color:#fff;border-radius:22px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(46,36,51,.28)}
.rest.show{display:flex}
.rest .rc{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;line-height:1;min-width:78px}
.rest .rl{flex:1;font-size:12.5px;color:#D9CFDF;line-height:1.3}
.rest .rl b{display:block;color:#fff;font-size:14px}
.rest button{min-height:46px;min-width:46px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px;padding:0 12px}
.rest.over{background:var(--rose)}
.rest .bar{position:absolute;left:16px;right:16px;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--rose2)}

/* nav */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tab .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tab button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tab button .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.65}
nav.tab button.on{color:var(--plum);font-weight:700}
nav.tab button.on .ic{filter:none;opacity:1}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(46,36,51,.45);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:22px 18px calc(22px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:'Lora',serif;font-size:28px;margin:0;color:var(--plum)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.stat small{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:22px;color:var(--plum);line-height:1.25}
.stat b em{font-style:normal;font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.stat.wide{grid-column:1/3}

/* run */
.runhero{background:var(--rose);color:#fff;border-radius:28px;padding:20px}
.runhero small{color:#FBE3E8;font-size:13px}
.runhero h2{margin:2px 0 8px;font-family:'Lora',serif;font-size:26px}
.plan{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.plan span{background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:600}
.weeks{display:grid;gap:10px}
.wk{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}
.wk.cur{border-color:var(--rose2);box-shadow:0 0 0 3px rgba(231,168,180,.22)}
.wk .wh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wk .wh b{color:var(--plum);font-size:16px}
.wk .wh span{font-size:12.5px;color:var(--muted)}
.wk p{margin:4px 0 10px;font-size:13.5px;color:#5A4E61}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{min-height:48px;border-radius:14px;background:#F4F0F5;font-weight:600;font-size:13.5px;color:var(--plum2);display:flex;align-items:center;justify-content:center;gap:6px}
.slot.ok{background:var(--sage2);color:var(--sage)}
.player{background:var(--plum);color:#fff;border-radius:30px;padding:22px;text-align:center}
.player .ph{font-size:15px;color:var(--rose2);font-weight:600}
.player .big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0}
.player .kind{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:700;margin-top:4px}
.player.run{background:var(--rose)}
.player.run .ph{color:#FFE4EA}
.player .sub{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:#EADCEF}
.player .sub b{display:block;color:#fff;font-size:18px;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:16px}
.pbar i{display:block;height:100%;background:#fff;border-radius:8px}
.timeline{display:flex;gap:3px;margin-top:14px;height:12px}
.timeline i{display:block;border-radius:3px;background:rgba(255,255,255,.2)}
.timeline i.r{background:rgba(255,255,255,.5)}
.timeline i.past{background:#fff}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
select{width:100%;height:52px;border:1.5px solid var(--line);border-radius:16px;padding:0 12px;background:#fff;font-weight:600}

/* history + progress */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#EBE5EE;border-radius:16px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:12px;font-weight:600;font-size:14px;color:var(--plum2)}
.seg button.on{background:#fff;color:var(--plum);box-shadow:0 1px 3px rgba(46,36,51,.1)}
.hist{display:grid;gap:10px;margin-top:14px}
.hi{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.hi > button{width:100%;text-align:left;padding:14px 16px;display:flex;gap:12px;align-items:center}
.hi .d{flex:none;width:50px;text-align:center;line-height:1.1}
.hi .d b{display:block;font-size:20px;color:var(--plum)}
.hi .d span{font-size:11.5px;color:var(--muted)}
.hi .t{flex:1;min-width:0}
.hi .t b{display:block;color:var(--plum)}
.hi .t span{font-size:13px;color:var(--muted)}
.hi .det{padding:0 16px 14px;display:none}
.hi.open .det{display:block}
.hi table{width:100%;border-collapse:collapse;font-size:13px}
.hi td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.hi td:last-child{text-align:right;color:var(--plum2)}
.chart{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:12px}
.chart h4{margin:0 0 2px;color:var(--plum);font-size:15.5px}
.chart .cs{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px}
.pc small{display:block;font-size:12.5px;color:var(--muted)}
.pc b{display:block;font-size:26px;color:var(--plum);line-height:1.2;margin-top:2px}
.pc b em{font-style:normal;font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.pc.hl{background:var(--plum);border-color:var(--plum)}
.pc.hl small{color:var(--rose2)} .pc.hl b{color:#fff} .pc.hl b em{color:#D9CFDF}
.evo{background:#fff;border:1px solid var(--line);border-radius:22px;padding:4px 16px}
.evo .er{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:10px}
.evo .er:first-child{border-top:0}
.evo .er span{font-size:14px;color:var(--plum)}
.evo .er em{font-style:normal;font-size:13px;color:var(--muted)}
.delta{font-size:13px;font-weight:700;padding:4px 9px;border-radius:99px;background:#F0ECF2;color:var(--plum2);white-space:nowrap}
.delta.up{background:var(--sage2);color:var(--sage)}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.small{font-size:13px}
.danger{color:#B4455A}
</style>
</head>
<body>
<div id="app"></div>
<div class="rest" id="rest" role="status" aria-live="polite">
  <div class="rc" id="restClock">1:30</div>
  <div class="rl"><b id="restTitle">Descanso</b><span id="restSub">Próxima série quando zerar</span></div>
  <button id="restPlus" aria-label="Adicionar 15 segundos">+15</button>
  <button id="restStop" aria-label="Parar descanso">Parar</button>
  <div class="bar"><i id="restBar" style="width:100%"></i></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const E=(key,sets,reps,rest,name,hkey)=>({key,sets,reps,rest,name:name||INFO[key][0],tip:INFO[key][1],hkey:hkey||key});
const PLAN = [

// progressão de corrida (semanas 1–8)
function runPlan(week, opt){
  if(week<=2) return {label:"Semanas 1–2",warm:5,run:2,walk:2,reps:7,cool:5,text:"5 min caminhada + (2 min corrida / 2 min caminhada) × 7 + 5 min caminhada"};
  if(week<=4) return {label:"Semanas 3–4",warm:5,run:3,walk:1.5,reps:7,cool:5,text:"5 min caminhada + (3 min corrida / 1,5 min caminhada) × 7 + 5 min caminhada"};
  if(week<=6) return {label:"Semanas 5–6",warm:5,run:5,walk:1,reps:5,cool:5,text:"5 min caminhada + (5 min corrida / 1 min caminhada) × 5 + 5 min caminhada"};
  if(week===7){ const r=(opt&&opt.run)||8, w=(opt&&opt.walk)||2;
    return {label:"Semana 7",warm:5,run:r,walk:w,reps:null,cool:0,free7:true,text:"5 min caminhada + blocos de 8–10 min correndo com 1–2 min caminhando, repetindo até se aproximar de 5 km"};}
  return {label:"Semana 8",warm:5,run:null,walk:null,reps:null,cool:0,goal:true,text:"Completar 5 km de forma confortável, podendo utilizar pequenas pausas para caminhada se necessário"};
}
function phases(week,opt){
  const p=runPlan(week,opt), out=[];
  out.push({k:"walk",name:"Aquecimento",dur:p.warm*60});
  if(p.reps){ for(let i=1;i<=p.reps;i++){ out.push({k:"run",name:`Corrida ${i} de ${p.reps}`,dur:p.run*60}); out.push({k:"walk",name:`Caminhada ${i} de ${p.reps}`,dur:p.walk*60}); } }
  else if(p.free7){ for(let i=1;i<=6;i++){ out.push({k:"run",name:`Bloco ${i} correndo`,dur:p.run*60}); out.push({k:"walk",name:`Caminhada ${i}`,dur:p.walk*60}); } }
  else { out.push({k:"run",name:"Rumo aos 5 km",dur:null}); }
  if(p.cool) out.push({k:"walk",name:"Desaquecimento",dur:p.cool*60});
  return out;
}

/* ------------------------------------------------------------ armazenamento */
const KEY="meutreino:v1";
let S = load();
function blank(){return {v:1,sessions:[],runs:[],drafts:{},activeRun:null,created:Date.now()}}
function load(){ try{ const t=localStorage.getItem(KEY); if(t){ const o=JSON.parse(t); return Object.assign(blank(),o);} }catch(e){} return blank(); }
let READY=false;
function save(){ if(!READY)return; const t=JSON.stringify(S); let ok=false; try{ localStorage.setItem(KEY,t); ok=true; }catch(e){} idbPut(t).then(()=>{}).catch(()=>{ if(!ok) toast("Não foi possível salvar neste aparelho"); }); }
/* cópia espelho em IndexedDB: se o localStorage for apagado, os dados voltam daqui */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("meutreino",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbPut(t){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(t,KEY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}))}
function idbGet(){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("kv","readonly");const q=tx.objectStore("kv").get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
function score(o){return (o.sessions||[]).length+(o.runs||[]).length+Object.keys(o.drafts||{}).length}
async function _unused(){ try{ const t=await idbGet(); if(!t)return; const o=JSON.parse(t); if(score(o)>score(S)||(!localStorage.getItem(KEY)&&score(o)>0)){ S=Object.assign(blank(),o); try{localStorage.setItem(KEY,t)}catch(e){} render(); } }catch(e){} }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

/* ------------------------------------------------------------ utilidades */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
function monday(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
const fmtD=s=>{const d=fromIso(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fmtDL=s=>{const d=fromIso(s);return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}).replace(".","")};
function clock(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
function durTxt(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h?`${h}h ${pad(m)}min`:`${m} min`}
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
const nf=(n,d=1)=>n==null?"–":n.toLocaleString("pt-BR",{maximumFractionDigits:d});
function parseTime(v){ // "38", "38.5", "38:30", "1:02:10" -> seconds
  if(v==null||v==="")return null; v=String(v).trim().replace(",",".");
  if(v.includes(":")){const p=v.split(":").map(Number);if(p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];}
  const n=parseFloat(v);return isNaN(n)?null:Math.round(n*60);
}
function pace(dist,sec){if(!dist||!sec)return null;return sec/dist}
const paceTxt=p=>p?`${Math.floor(p/60)}:${pad(Math.round(p%60)%60)} min/km`:"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// som + vibração
let AC=null;
function unlockAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==="suspended")AC.resume();}catch(e){}}
function beep(times=2,freq=880){try{unlockAudio();if(!AC)return;for(let i=0;i<times;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=freq;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24);}}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
document.addEventListener("pointerdown",unlockAudio,{once:true});
let wakeLock=null;
async function keepAwake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

/* ------------------------------------------------------------ dados derivados */
function weekSessions(){const m=monday(),e=new Date(m);e.setDate(e.getDate()+7);return S.sessions.filter(s=>{const d=fromIso(s.date);return d>=m&&d<e})}
function doneThisWeek(dayId){return weekSessions().find(s=>s.dayId===dayId)}
function lastFor(hkey, excludeId){ // sessão mais recente com registro do exercício
  const list=S.sessions.filter(s=>s.id!==excludeId&&s.ex&&s.ex[hkey]&&s.ex[hkey].sets.some(x=>num(x.w)!=null||num(x.r)!=null));
  list.sort((a,b)=>b.endedAt-a.endedAt); return list[0]?{date:list[0].date,sets:list[0].ex[hkey].sets}:null;
}
function runDone(week,n){return S.runs.find(r=>r.week===week&&r.n===n)}
function nextRunSlot(){for(let w=1;w<=8;w++)for(let n=1;n<=3;n++)if(!runDone(w,n))return {week:w,n};return {week:8,n:3}}
function draft(dayId){
  if(!S.drafts[dayId]){const d=DAY[dayId];S.drafts[dayId]={dayId,startedAt:null,date:today(),ex:Object.fromEntries(d.ex.map(e=>[e.hkey,{sets:Array.from({length:e.sets},()=>({w:"",r:"",done:false})),done:false}])),cardio:{dist:"",time:"",notes:"",runId:null}}}
  return S.drafts[dayId];
}
function hasData(dr){return dr&&(dr.startedAt||Object.values(dr.ex).some(x=>x.done||x.sets.some(s=>s.w||s.r||s.done))||dr.cardio.dist||dr.cardio.time)}
function volume(ex){let v=0;for(const k in ex)for(const s of ex[k].sets){const w=num(s.w),r=num(s.r);if(s.done&&w&&r)v+=w*r}return v}
function exIsDone(x){return x.done||x.sets.every(s=>s.done)}
function streak(){ // dias úteis seguidos com treino finalizado
  const days=new Set(S.sessions.map(s=>s.date)); let d=new Date(); d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const isWd=x=>x.getDay()>=1&&x.getDay()<=5; let c=0;
  if(!days.has(iso(d))){d.setDate(d.getDate()-1)}
  for(let i=0;i<400;i++){ if(!isWd(d)){d.setDate(d.getDate()-1);continue} if(days.has(iso(d))){c++;d.setDate(d.getDate()-1)} else break; }
  return c;
}

function ringSvg(p,size=92,stroke=9,col="#E7A8B4",bg="rgba(255,255,255,.15)"){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${bg}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
function viewHome(){
  const m=monday(),f=new Date(m);f.setDate(f.getDate()+4);
  const done=PLAN.filter(d=>doneThisWeek(d.id)).length;
  const wd=new Date().getDay();
  const nx=nextRunSlot();
  const msg=done===5?"Semana completa. Excelente!":done===0?"Vamos começar a semana.":`Faltam ${5-done} treino${5-done>1?"s":""} esta semana.`;
  const days=PLAN.map(d=>{
    const dn=doneThisWeek(d.id), dr=S.drafts[d.id], dt=new Date(m);dt.setDate(dt.getDate()+d.wd-1);
    const st=dn?`<span class="pill ok">✓ Concluído</span>`:hasData(dr)?`<span class="pill go">Em andamento</span>`:`<span class="pill">Pendente</span>`;
    return `<button class="day ${dn?"done":""} ${wd===d.wd?"today":""}" data-go="treino/${d.id}">
      <div class="dn">${dn?"✓":d.short}<small>${pad(dt.getDate())}/${pad(dt.getMonth()+1)}</small></div>
      <div class="t"><b>${d.day}${wd===d.wd?" · hoje":""}</b><span>${d.focus} + ${d.cardio.title.toLowerCase()}</span></div>${st}</button>`}).join("");
  return `<div class="top"><h1>Meu Treino</h1><p>Semana de ${pad(m.getDate())}/${pad(m.getMonth()+1)} a ${pad(f.getDate())}/${pad(f.getMonth()+1)}</p></div>
  <div class="weekcard"><div class="ring">${ringSvg(done/5)}<b>${done}/5<small>treinos</small></b></div>
    <div><h2>${msg}</h2><p>Corrida: semana ${nx.week} de 8 · treino ${nx.n}</p></div></div>
  <div class="days">${days}</div>
  <div class="sectionh"><h3>Próxima corrida</h3><button data-go="corrida">Ver progressão</button></div>
  <button class="card" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center" data-go="corrida/${nx.week}/${nx.n}">
    <span style="font-size:28px">🏃</span><span class="grow"><b style="color:var(--plum)">Semana ${nx.week} · treino ${nx.n}</b><br><span class="small muted">${esc(runPlan(nx.week).text)}</span></span></button>`;
}

/* ------------------------------------------------------------ TREINO */
function viewPick(){
  const wd=new Date().getDay();
  if(wd>=1&&wd<=5&&!doneThisWeek(PLAN[wd-1].id)){ setTimeout(()=>go("treino/"+PLAN[wd-1].id),0); return ""; }
  return `<div class="top"><h1>Treino</h1><p>Escolha o dia que você vai treinar.</p></div><div class="days">${PLAN.map(d=>{const dn=doneThisWeek(d.id);return `<button class="day ${dn?"done":""}" data-go="treino/${d.id}"><div class="dn">${dn?"✓":d.short}</div><div class="t"><b>${d.day}</b><span>${d.focus}</span></div>${dn?'<span class="pill ok">✓ Concluído</span>':'<span class="pill">Abrir</span>'}</div></button>`}).join("")}</div>`;
}
const CHK=`<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function cmpTxt(cur,last){const c=num(cur),l=last?num(last.w):null;if(c==null||l==null)return["",""];const d=Math.round((c-l)*10)/10;if(d>0)return["up",`⬆️ +${nf(d)} kg em relação ao último treino`];if(d<0)return["down",`⬇️ ${nf(d)} kg em relação ao último treino`];return["eq",`= mesmo peso do último treino (${nf(l)} kg)`]}
function viewWorkout(id){
  const d=DAY[id]; if(!d)return viewPick();
  const dr=draft(id); save();
  const dn=doneThisWeek(id);
  const chips=PLAN.map(p=>`<button class="chip ${p.id===id?"on":""}" data-go="treino/${p.id}">${doneThisWeek(p.id)?'<span class="dot"></span>':""}${p.short}</button>`).join("");
  const exs=d.ex.map((e,i)=>{
    const x=dr.ex[e.hkey], last=lastFor(e.hkey), ok=exIsDone(x);
    const lastBox=last?`<div class="last"><div class="lr"><span>Último treino · <b>${fmtD(last.date)}</b></span><button class="linkbtn" data-act="repeat" data-ex="${e.hkey}" data-day="${id}">Repetir cargas</button></div>
      <div>${last.sets.map((s,k)=>`S${k+1}: <b>${s.w?nf(num(s.w))+" kg":"–"}</b> × ${s.r||"–"}`).join(" &nbsp;·&nbsp; ")}</div></div>`:
      `<div class="last">Primeiro registro deste exercício. Anote a carga de cada série.</div>`;
    const sets=x.sets.map((s,k)=>{const ls=last&&last.sets[k];const [cc,ct]=cmpTxt(s.w,ls);
      return `<div class="set ${s.done?"ok":""}" data-set="${k}">
        <div class="sn">${k+1}</div>
        <div class="field"><label>Peso</label><input type="number" inputmode="decimal" step="0.5" min="0" data-f="w" data-ex="${e.hkey}" data-k="${k}" data-day="${id}" value="${esc(s.w)}" placeholder="${ls&&ls.w?esc(ls.w):"0"}" aria-label="Peso da série ${k+1}"><span class="u">kg</span></div>
        <div class="field"><label>Reps</label><input type="number" inputmode="numeric" step="1" min="0" data-f="r" data-ex="${e.hkey}" data-k="${k}" data-day="${id}" value="${esc(s.r)}" placeholder="${ls&&ls.r?esc(ls.r):e.reps.split("–").pop()}" aria-label="Repetições da série ${k+1}"></div>
        <button class="chk" data-act="set" data-ex="${e.hkey}" data-k="${k}" data-day="${id}" aria-label="Marcar série ${k+1} como concluída">${CHK}</button>
        <div class="cmp ${cc}" id="cmp-${e.hkey}-${k}">${ct}</div></div>`}).join("");
    return `<div class="ex ${ok?"done":""}" id="ex-${e.hkey}">
      <div class="fig"><div class="num">${ok?"✓":i+1}</div>${FIGS[e.key]}</div>
      <div class="body"><h2>${e.name}</h2>
        <div class="meta"><span>${e.sets} × ${e.reps}</span><span class="r">⏱ Descanso ${e.rest} s</span></div>
        <div class="tip"><i>!</i><span>${e.tip}</span></div>
        ${lastBox}
        <div class="sets">${sets}</div>
        <div class="exfoot"><button class="btn soft sm" data-act="rest" data-rest="${e.rest}" data-name="${esc(e.name)}">⏱ Descanso ${e.rest} s</button>
          <button class="btn sm ${ok?"done-on":"ghost"}" data-act="exdone" data-ex="${e.hkey}" data-day="${id}">${ok?"✓ Concluído":"✓ Concluir"}</button></div>
      </div></div>`}).join("");
  const c=d.cardio, cd=dr.cardio;
  const nx=nextRunSlot();
  const runExtra=c.kind==="run"?`<div class="plan" style="margin:12px 0 4px"><span>Semana ${nx.week} · treino ${nx.n}</span></div><p style="margin-top:4px">${esc(runPlan(nx.week).text)}</p>
     <button class="btn primary block" style="margin-top:12px" data-go="corrida/${nx.week}/${nx.n}">🏃 Abrir corrida guiada</button>
     ${cd.runId?`<p style="margin-top:10px">✓ Corrida registrada e vinculada a este treino.</p>`:""}`:"";
  const cardio=`<div class="cardio"><div class="fig">${FIGS[c.fig]}</div><div class="body">
      <small style="color:var(--rose2)">Cardio do dia</small><h2>${c.title} <span style="font-family:Poppins;font-size:14px;color:var(--rose2);font-weight:500">${c.dur}</span></h2>
      <p>${c.desc}</p>${runExtra}

function lineChart(pts,{unit="",yfmt=v=>nf(v,1),invert=false}={}){
  if(pts.length===0)return `<div class="empty"><b>Sem dados ainda</b>Registre treinos para ver a evolução aqui.</div>`;
  const W=320,H=150,px=34,py=18,ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  const X=i=>pts.length===1?W/2:px+(W-px-12)*i/(pts.length-1), Y=v=>py+(H-py*2)*(1-(v-mn)/(mx-mn));
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const area=`M${X(0)},${H-py} L${line.split(" ").join(" L")} L${X(pts.length-1)},${H-py} Z`;
  const grid=[mn+pad,(mn+mx)/2,mx-pad].map(v=>`<line x1="${px}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEE7F0"/><text x="${px-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#9C91A4">${yfmt(v)}</text>`).join("");
  const step=Math.ceil(pts.length/5);
  const lbl=pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${X(i)}" y="${H-2}" text-anchor="${pts.length>1&&i===pts.length-1?"end":i===0&&pts.length>1?"start":"middle"}" font-size="10" fill="#9C91A4">${p.x}</text>`:"").join("");
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="#fff" stroke="#C9657A" stroke-width="2.5"/>`).join("");
  const lastP=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">${grid}<path d="${area}" fill="rgba(201,101,122,.1)"/><polyline points="${line}" fill="none" stroke="#C9657A" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lbl}
   <text x="${Math.min(X(pts.length-1),W-24)}" y="${Y(lastP.y)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#3B2A45">${yfmt(lastP.y)}${unit}</text></svg>`;
}

    body=list.length?`<div class="hist">${list.map(r=>{const dt=fromIso(r.date);return `<div class="hi"><button data-act="toggle"><div class="d"><b>${pad(dt.getDate())}</b><span>${dt.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}</span></div>
      <div class="t"><b>${nf(r.dist,2)} km · ${clock(r.timeSec)}</b><span>Semana ${r.week} · treino ${r.n} · ${paceTxt(r.paceSec)}</span></div><span class="muted">⌄</span></button>
      <div class="det"><table><tr><td>🏃 Correndo</td><td>${r.runMin!=null?nf(r.runMin)+" min":"–"}</td></tr><tr><td>🚶 Caminhando</td><td>${r.walkMin!=null?nf(r.walkMin)+" min":"–"}</td></tr>${r.notes?`<tr><td>Observações</td><td style="text-align:left">${esc(r.notes)}</td></tr>`:""}</table>
      <button class="btn linkbtn danger" data-act="delRun" data-id="${r.id}">Excluir este registro</button></div></div>`}).join("")}</div>`
      :`<div class="empty"><b>Nenhuma corrida registrada</b>Comece pela semana 1 da progressão.<br><button class="btn primary sm" style="margin-top:14px" data-go="corrida">Ver corrida</button></div>`;
  } else {
    const withData=ALLEX.filter(([k])=>exHistory(k).length);
    if(!CHART_EX||!withData.find(([k])=>k===CHART_EX))CHART_EX=withData[0]?withData[0][0]:ALLEX[0][0];
    const runs=[...S.runs].sort((a,b)=>a.endedAt-b.endedAt);
    const k5=runs.filter(r=>r.dist>=5);
    body=`<div class="chart"><h4>📈 Peso utilizado no exercício</h4><div class="cs">Maior carga registrada em cada treino</div>
      <select data-chart="ex" style="margin-bottom:10px">${(withData.length?withData:ALLEX).map(([k,n])=>`<option value="${k}" ${k===CHART_EX?"selected":""}>${n}</option>`).join("")}</select>
      ${lineChart(exHistory(CHART_EX),{unit:" kg"})}</div>
     <div class="chart"><h4>📈 Distância corrida</h4><div class="cs">Cada corrida registrada</div>${lineChart(runs.map(r=>({x:fmtD(r.date),y:r.dist})),{unit:" km",yfmt:v=>nf(v,1)})}</div>
     <div class="chart"><h4>📈 Tempo nos 5 km</h4><div class="cs">Corridas de 5 km ou mais, em minutos</div>${lineChart(k5.map(r=>({x:fmtD(r.date),y:r.timeSec/60})),{unit:" min",yfmt:v=>nf(v,0)})}</div>`;
  }
  return `<div class="top"><h1>Histórico</h1><p>${S.sessions.length} treinos · ${S.runs.length} corridas</p></div>${tabs}${body}`;
}

/* ------------------------------------------------------------ PROGRESSO */
function viewProgress(){
  const now=new Date(), ym=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const month=S.sessions.filter(s=>s.date.startsWith(ym)).length;
  const kmAll=S.runs.reduce((a,r)=>a+(r.dist||0),0), kmMonth=S.runs.filter(r=>r.date.startsWith(ym)).reduce((a,r)=>a+(r.dist||0),0);
  const best=S.runs.reduce((m,r)=>r.dist>(m?m.dist:0)?r:m,null);
  const k5=S.runs.filter(r=>r.dist>=5).reduce((m,r)=>!m||r.timeSec<m.timeSec?r:m,null);
  const evo=ALLEX.map(([k,n])=>{const h=exHistory(k);if(!h.length)return"";const f=h[0].y,l=h[h.length-1].y,d=Math.round((l-f)*10)/10;
    return `<div class="er"><div><span>${n}</span><br><em>${nf(f)} kg → ${nf(l)} kg · ${h.length} treino${h.length>1?"s":""}</em></div><span class="delta ${d>0?"up":""}">${d>0?"⬆️ +":d<0?"":"= "}${nf(d)} kg</span></div>`}).join("");
  const mname=now.toLocaleDateString("pt-BR",{month:"long"});
  return `<div class="top"><h1>Meu progresso</h1><p>Resumo de ${mname} e da sua jornada até os 5 km</p></div>
   <div class="pgrid">
    <div class="pc hl"><small>Treinos em ${mname}</small><b>${month}</b></div>
    <div class="pc"><small>Sequência atual</small><b>${streak()}<em>dias úteis</em></b></div>
    <div class="pc"><small>Km corridos no mês</small><b>${nf(kmMonth,1)}<em>km</em></b></div>
    <div class="pc"><small>Km corridos no total</small><b>${nf(kmAll,1)}<em>km</em></b></div>
    <div class="pc"><small>Melhor distância</small><b>${best?nf(best.dist,2):"–"}<em>km</em></b></div>
    <div class="pc"><small>Melhor tempo nos 5 km</small><b>${k5?clock(k5.timeSec):"–"}</b></div>
   </div>
   <div class="sectionh"><h3>Evolução das cargas</h3><button data-go="historico/graficos">Ver gráficos</button></div>
   ${evo?`<div class="evo">${evo}</div>`:`<div class="card empty"><b>Sem cargas registradas</b>Registre o peso das séries e finalize um treino.</div>`}
   <div class="sectionh"><h3>Seus dados</h3></div>
   <div class="card small">Os registros ficam salvos neste navegador, neste aparelho. Faça uma cópia de segurança de vez em quando.
    <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn soft sm" data-act="export">Copiar backup</button><button class="btn ghost sm" data-act="import">Restaurar backup</button><button class="btn sm linkbtn danger" data-act="reset">Apagar tudo</button></div></div>`;
}

/* ------------------------------------------------------------ eventos */
function closeModal(){$("#modal").classList.remove("show")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();closeModal();go(g.dataset.go);return}
  const b=e.target.closest("[data-act]"); if(!b)return;
  const act=b.dataset.act, day=b.dataset.day;
  if(act==="start"){startWorkout(day);render();toast("Cronômetro iniciado. Bom treino!")}
  else if(act==="set"){const dr=draft(day),x=dr.ex[b.dataset.ex],s=x.sets[+b.dataset.k];s.done=!s.done;
    if(s.done){startWorkout(day);if(!s.r){const e=DAY[day].ex.find(z=>z.hkey===b.dataset.ex);const last=lastFor(b.dataset.ex);s.r=(last&&last.sets[+b.dataset.k]&&last.sets[+b.dataset.k].r)||"";}
      const e=DAY[day].ex.find(z=>z.hkey===b.dataset.ex); if(x.sets.every(z=>z.done))x.done=true; else startRest(e.rest,e.name);}
    else x.done=false;
    save();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(act==="exdone"){const dr=draft(day),x=dr.ex[b.dataset.ex];const now=!exIsDone(x);x.done=now;if(!now)x.sets.forEach(s=>s.done=false);else startWorkout(day);save();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(act==="repeat"){const dr=draft(day),x=dr.ex[b.dataset.ex],last=lastFor(b.dataset.ex);if(last){x.sets.forEach((s,k)=>{if(!s.w&&last.sets[k]&&last.sets[k].w)s.w=last.sets[k].w;if(!s.r&&last.sets[k]&&last.sets[k].r)s.r=last.sets[k].r});save();const y=window.scrollY;render();window.scrollTo(0,y);toast("Cargas do último treino copiadas. Ajuste se quiser.")}}
  else if(act==="rest"){startRest(+b.dataset.rest,b.dataset.name)}
  else if(act==="finish"){summary(day)}
  else if(act==="confirmFinish"){finish(day)}
  else if(act==="discard"){if(confirm("Apagar tudo o que foi preenchido neste treino de hoje?")){delete S.drafts[day];save();stopRest();render()}}
  else if(act==="close"){closeModal()}
  else if(act==="toggle"){b.parentElement.classList.toggle("open")}
  else if(act==="delSess"){if(confirm("Excluir este treino do histórico?")){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);save();render()}}
  else if(act==="delRun"){if(confirm("Excluir esta corrida do histórico?")){S.runs=S.runs.filter(s=>s.id!==b.dataset.id);save();render()}}
  else if(act==="runStart"){runStart(+b.dataset.w,+b.dataset.n)}
  else if(act==="runManual"){runFinishForm({w:+b.dataset.w,n:+b.dataset.n})}
  else if(act==="runPause"){const a=S.activeRun;if(a.pausedAt){a.pausedTotal+=Date.now()-a.pausedAt;a.pausedAt=null}else a.pausedAt=Date.now();save();render()}
  else if(act==="runSkip"){const a=S.activeRun;const ph=phases(a.week,a.opt);const el=runElapsed(a);if(ph[a.idx]){a.acc[ph[a.idx].k]+=Math.max(0,el-a.phStart);a.idx++;a.phStart=el;save();beep(1,740);render()}}
  else if(act==="runEnd"){runFinishForm()}
  else if(act==="runCancel"){if(confirm("Cancelar esta corrida sem salvar?")){S.activeRun=null;save();keepAwake(false);go("corrida")}}
  else if(act==="runSave"){runSave(+b.dataset.w,+b.dataset.n,b.dataset.manual==="1")}
  else if(act==="export"){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Backup copiado. Cole num lugar seguro (notas, e-mail).")).catch(()=>{prompt("Copie o texto do backup:",t)})}
  else if(act==="import"){const t=prompt("Cole aqui o texto do backup:");if(t){try{const o=JSON.parse(t);if(!o.sessions||!o.runs)throw 0;S=Object.assign(blank(),o);save();render();toast("Backup restaurado")}catch(err){toast("Texto de backup inválido")}}}
  else if(act==="reset"){if(confirm("Apagar TODOS os treinos, corridas e cargas deste aparelho?")){S=blank();save();render();toast("Dados apagados")}}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f){const dr=draft(t.dataset.day),s=dr.ex[t.dataset.ex].sets[+t.dataset.k];s[t.dataset.f]=t.value;save();
    if(t.dataset.f==="w"){const last=lastFor(t.dataset.ex);const [c,txt]=cmpTxt(t.value,last&&last.sets[+t.dataset.k]);const el=document.getElementById(`cmp-${t.dataset.ex}-${t.dataset.k}`);if(el){el.className="cmp "+c;el.textContent=txt}}}
  else if(t.dataset.cf){draft(t.dataset.day).cardio[t.dataset.cf]=t.value;save()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.opt){RUNOPT[t.dataset.opt]=+t.value;render()}
  if(t.dataset.chart){CHART_EX=t.value;render()}
});
$("#restStop").addEventListener("click",stopRest);
$("#restPlus").addEventListener("click",()=>{if(REST){REST.end+=15000;REST.total+=15;$("#rest").classList.remove("over");REST.beeped=false;tick()}});

/* ------------------------------------------------------------ relógio */
function tick(){
  const [top,a]=route.split("/");
  if(top==="treino"&&a&&S.drafts[a]&&S.drafts[a].startedAt){const el=$("#wclock");if(el)el.textContent=clock((Date.now()-S.drafts[a].startedAt)/1000)}
  if(REST){const left=(REST.end-Date.now())/1000;
    if(left<=0){$("#restClock").textContent="0:00";$("#rest").classList.add("over");$("#restSub").textContent="Hora da próxima série!";$("#restBar").style.width="0%";
      if(!REST.beeped){REST.beeped=true;beep(3,880)} if(left<-20)stopRest();}
    else{$("#restClock").textContent=clock(Math.ceil(left));$("#restSub").textContent="Toque em Parar para seguir antes";$("#restBar").style.width=(left/REST.total*100)+"%"}}
  const ar=S.activeRun;
  if(ar&&top==="corrida"&&a==="play"){
    if(runAdvance(ar)){render();return}
    const ph=phases(ar.week,ar.opt),cur=ph[ar.idx],el=runElapsed(ar);
    if(!cur){return}
    const inPh=el-ar.phStart;
    const big=$("#plBig"); if(big)big.textContent=cur.dur!=null?clock(cur.dur-inPh):clock(inPh);
    const e2=$("#plEl"); if(e2)e2.textContent=clock(el);
  }
}
setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render()}});

(async function boot(){
  let hasLocal=false; try{hasLocal=!!localStorage.getItem(KEY)}catch(e){}
  if(!hasLocal){ try{ const t=await idbGet(); if(t){ S=Object.assign(blank(),JSON.parse(t)); try{localStorage.setItem(KEY,t)}catch(e){} } }catch(e){} }
  else { try{ const t=await idbGet(); if(t){ const o=JSON.parse(t); if(score(o)>score(S)){ S=Object.assign(blank(),o); try{localStorage.setItem(KEY,t)}catch(e){} } } }catch(e){} }
  READY=true; save(); render();
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
